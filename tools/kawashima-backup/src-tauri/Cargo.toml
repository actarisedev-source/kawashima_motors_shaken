[package]
name = "kawashima-backup-tool"
version = "0.5.0"
description = "Kawashima Motors backup tool"
authors = ["ACTARISE"]
edition = "2021"

[lib]
name = "kawashima_backup_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
age = "0.12.1"
chrono = { version = "0.4.42", features = ["serde"] }
dirs = "6.0.0"
argon2 = "0.5.3"
base64 = "0.22.1"
keyring = { version = "3.6.3", features = ["apple-native"] }
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.2"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
tar = { version = "0.4.44", default-features = false }
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.4.0"
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = ["time"] }
tokio-postgres = "0.7.13"
tokio-postgres-rustls = { version = "0.14.0", features = ["ring"] }
zeroize = "1.8.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Credentials",
  "Win32_Storage_FileSystem",
  "Win32_System_Memory",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
] }
